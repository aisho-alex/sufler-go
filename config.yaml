audio:
  samplerate: 16000
  block_ms: 250
  backend: auto             # auto | ffmpeg | sounddevice
  mic_device: null          # null = устройство ввода по умолчанию, или индекс
  monitor_device: null      # null = авто-поиск "Monitor of <выход по умолчанию>"

vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 600
  max_segment_ms: 15000
  pad_ms: 120

asr:
  model: large-v3-turbo     # tiny | base | small | medium | large-v3-turbo (~6 GB VRAM)
  device: cuda
  compute_type: float16
  language: ru
  beam_size: 1

llm:
  base_url: null            # null = взять из .env NEURALDEEP_BASE_URL
  model: null               # null = взять из .env SUFLER_MODEL
  temperature: 0.3
  timeout_s: 25
  min_interval_s: 5         # не чаще, чем раз в N секунд
  trigger_words: 20         # или при >= N новых слов
  trigger_seconds: 20       # или если новые слова копятся дольше N секунд
  context_seconds: 180      # окно контекста для анализа
  max_context_chars: 6000
  max_hint_chars: 300
  guided_json: true         # structured output neuraldeep (фолбэк автоматом)

db:
  path: data/sufler.db

log_path: data/sufler.log   # транскрипты, подсказки, заметки, вопросы/ответы

ui:
  width: 470
  height: 400
  opacity: 1.0

prompt_path: prompts/default.txt
